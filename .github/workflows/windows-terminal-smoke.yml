name: Windows terminal smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "app.go"
      - "app_integration_test.go"
      - "local_terminal.go"
      - "local_terminal_windows.go"
      - "local_terminal_test.go"
      - "local_terminal_windows_test.go"
      - "frontend/src/App.tsx"
      - "frontend/src/terminalCwd.ts"
      - "frontend/src/terminalThemes.ts"
      - "frontend/src/styles.css"
      - "frontend/src/components/TerminalPane.tsx"
      - "frontend/src/components/TerminalPane.test.tsx"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "internal/ssh/**"
      - "internal/sftp/**"
      - "sftp_ai.go"
      - "sftp_ai_test.go"
      - "frontend/src/components/SFTPView.tsx"
      - "frontend/src/components/SFTPAIAssistant.tsx"
      - "go.mod"
      - "go.sum"
      - "wails.json"
      - ".github/workflows/windows-terminal-smoke.yml"

permissions:
  contents: read

concurrency:
  group: windows-terminal-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Restore cached Wails CLI
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-go.outputs.go-bin-path }}/wails.exe
          key: windows-wails-cli-v2.17.0-go${{ steps.setup-go.outputs.go-version }}-${{ runner.arch }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Test Go on Windows
        run: go test ./...
      - name: Stress SSH command execution on Windows
        run: go test ./internal/ssh -run "TestExec(ExitCode|RepeatedCommandRoundTrips|StdinClosed|TimeoutDoesNotDisconnectInteractiveSSH)" -count=3 -timeout=3m
      - name: Ensure cached Wails CLI
        shell: pwsh
        run: |
          $wails = Join-Path (go env GOPATH) "bin/wails.exe"
          if (!(Test-Path $wails)) {
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Using cached Wails CLI: $wails"
          }
          if (!(Test-Path $wails)) { throw "Wails CLI missing after installation/cache restore" }
      - name: Restore generated app icons
        id: icon-cache
        uses: actions/cache@v6
        with:
          path: |
            build/appicon.png
            build/windows/icon.ico
            frontend/public/app-icon.png
          key: windows-app-icons-v1-${{ hashFiles('build/appicon.png', 'scripts/generate_app_icons.py') }}
      - name: Generate app icons on cache miss
        if: steps.icon-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/generate_app_icons.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate generated app icons
        shell: pwsh
        run: |
          foreach ($file in @("build/appicon.png", "build/windows/icon.ico", "frontend/public/app-icon.png")) {
            if (!(Test-Path $file)) { throw "Required icon asset missing: $file" }
          }
      - name: Compile Windows executable (no release)
        shell: pwsh
        run: |
          & "$(go env GOPATH)\bin\wails.exe" build -platform windows/amd64 -clean -s -webview2 embed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "build/bin/OpenShell.exe")) { throw "OpenShell.exe was not generated" }
          python scripts/verify_windows_icons.py --icon build/windows/icon.ico --exe build/bin/OpenShell.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare bundled ZMODEM utilities
        shell: pwsh
        run: |
          ./scripts/prepare_zmodem_windows.ps1
          foreach ($file in @("rz.exe", "sz.exe", "msys-2.0.dll", "lrzsz-win32-source.zip", "COPYING-lrzsz.txt")) {
            if (!(Test-Path "build/bin/zmodem/$file")) { throw "Missing bundled helper: $file" }
          }
      - name: Package test executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/bin/OpenShell.exe, build/bin/zmodem -DestinationPath dist/OpenShell-windows-x64-smoke.zip -Force
      - name: Upload Windows test build
        uses: actions/upload-artifact@v7
        with:
          name: OpenShell-windows-x64-smoke
          path: dist/OpenShell-windows-x64-smoke.zip
          if-no-files-found: error
          retention-days: 7
