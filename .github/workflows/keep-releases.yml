name: Keep latest three GitHub Releases

on:
  workflow_run:
    workflows:
      - Build and release Windows
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - ".github/workflows/keep-releases.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openshell-release-retention
  cancel-in-progress: false

jobs:
  prune:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep the latest three published releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t release_tags < <(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 1000 \
              --exclude-drafts \
              --json tagName,publishedAt \
              --jq 'sort_by(.publishedAt) | reverse | .[].tagName'
          )

          echo "Found ${#release_tags[@]} published releases."
          if (( ${#release_tags[@]} <= 3 )); then
            echo "No releases need to be removed."
            exit 0
          fi

          printf 'Keeping: %s\n' "${release_tags[@]:0:3}"

          for (( i = 3; i < ${#release_tags[@]}; i++ )); do
            tag="${release_tags[i]}"
            echo "Deleting old release: $tag (keeping its Git tag)"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          done
