name: Windows Go cache benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-go-cache-benchmark.yml"

permissions:
  contents: read

concurrency:
  group: windows-go-cache-benchmark-${{ github.event.pull_request.number }
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare common Wails build assets
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go module directory
        id: paths
        shell: pwsh
        run: |
          "module_cache=$(go env GOMODCACHE)" >> $env:GITHUB_OUTPUT
      - name: Restore existing module-only cache for preparation
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.paths.outputs.module_cache }
          key: windows-go-modules-v1-${{ hashFiles('go.sum') }-wails-v2.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate normal Windows app icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/generate_app_icons.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build frontend once
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Prepare pinned Wails CLI once
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path ci-tools | Out-Null
          Copy-Item (Join-Path (go env GOPATH) "bin/wails.exe") ci-tools/wails.exe
      - name: Upload identical inputs for all cache strategies
        uses: actions/upload-artifact@v7
        with:
          name: windows-go-cache-benchmark-inputs
          path: |
            ci-tools/wails.exe
            build/windows/icon.ico
            frontend/dist/
          if-no-files-found: error
          retention-days: 2

  benchmark:
    name: Cache strategy - ${{ matrix.mode }
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [module-only, setup-go-combined, no-cache]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: ${{ matrix.mode == 'setup-go-combined' }
          cache-dependency-path: go.sum
      - name: Locate Go module cache
        if: matrix.mode == 'module-only'
        id: paths
        shell: pwsh
        run: |
          "module_cache=$(go env GOMODCACHE)" >> $env:GITHUB_OUTPUT
      - name: Restore existing 367 MB module-only cache
        if: matrix.mode == 'module-only'
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.paths.outputs.module_cache }
          key: windows-go-modules-v1-${{ hashFiles('go.sum') }-wails-v2.17.0
      - name: Download shared Wails CLI, frontend and icon
        uses: actions/download-artifact@v8
        with:
          name: windows-go-cache-benchmark-inputs
          path: .
      - name: Validate identical inputs
        shell: pwsh
        run: |
          foreach ($asset in @("ci-tools/wails.exe", "build/windows/icon.ico", "frontend/dist/index.html")) {
            if (!(Test-Path $asset)) { throw "Missing common benchmark asset: $asset" }
          }
      - name: Compile Windows OpenShell executable
        shell: pwsh
        env:
          CACHE_MODE: ${{ matrix.mode }
        run: |
          $ErrorActionPreference = "Stop"
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          & ./ci-tools/wails.exe build -platform windows/amd64 -clean -s -webview2 embed
          $code = $LASTEXITCODE
          $timer.Stop()
          if ($code -ne 0) { throw "Wails build failed in $env:CACHE_MODE mode (exit $code)" }
          if (!(Test-Path "build/bin/OpenShell.exe")) { throw "OpenShell.exe not generated" }
          python scripts/verify_windows_icons.py --icon build/windows/icon.ico --exe build/bin/OpenShell.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $seconds = [math]::Round($timer.Elapsed.TotalSeconds,1)
          Write-Host "GO_CACHE_BENCHMARK mode=$env:CACHE_MODE compile_seconds=$seconds"
          "| $env:CACHE_MODE | $seconds seconds |" >> $env:GITHUB_STEP_SUMMARY
