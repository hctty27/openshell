name: Temporary xterm 6.1 dependency lock refresh

on:
  push:
    branches: [fix/tui-clipboard-focus]
    paths:
      - ".github/workflows/update-xterm-beta.yml"

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pin compatible xterm 6.1 beta and addons
        working-directory: frontend
        run: |
          npm install --save-exact \
            @xterm/xterm@6.1.0-beta.315 \
            @xterm/addon-fit@beta \
            @xterm/addon-search@beta \
            @xterm/addon-web-links@beta \
            @xterm/addon-webgl@beta
      # Validate API changes after upgrading beta packages.
      - name: Validate frontend build
        working-directory: frontend
        run: npm run build
      - name: Validate frontend unit tests
        working-directory: frontend
        run: npm test -- --run
      - name: Commit reproducible lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/update-xterm-beta.yml
          git add frontend/package.json frontend/package-lock.json
          git commit -m "build(terminal): pin compatible xterm 6.1 beta packages"
          git push origin HEAD:fix/tui-clipboard-focus
