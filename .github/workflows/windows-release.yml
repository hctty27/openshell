name: Build and release Windows

on:
  workflow_call:
    inputs:
      publish:
        description: Publish a GitHub Release after CI succeeds
        required: true
        type: boolean
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openshell-windows-release
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate and set build version
        shell: pwsh
        run: |
          $tag = (Get-Content ".github/release-version.txt" -Raw).Trim()
          if ($tag -notmatch "^v[0-9]+\.[0-9]+\.[0-9]+$") { throw "Invalid release version: $tag" }
          $version = $tag.Substring(1)
          $packageVersion = (Get-Content "frontend/package.json" -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $version) { throw "Version mismatch: $packageVersion vs $version" }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "VITE_APP_VERSION=$version" >> $env:GITHUB_ENV
          $config = Get-Content wails.json -Raw | ConvertFrom-Json
          $config.info.productVersion = $version
          $config | ConvertTo-Json -Depth 20 | Set-Content wails.json -Encoding utf8
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go modules cache
        id: go-mod-cache
        shell: pwsh
        run: |
          "path=$(go env GOMODCACHE)" >> $env:GITHUB_OUTPUT
      - name: Cache Go modules only
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-mod-cache.outputs.path }}
          key: windows-go-modules-v1-${{ hashFiles('go.sum') }}-wails-v2.17.0
          restore-keys: |
            windows-go-modules-v1-
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Generate AI icon assets
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/generate_app_icons.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows executable
        shell: pwsh
        run: |
          & "$(go env GOPATH)\bin\wails.exe" build -platform windows/amd64 -clean -s -webview2 embed -ldflags "-X github.com/hctty27/openshell/internal/branding.Version=$env:APP_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "build/bin/OpenShell.exe")) { throw "OpenShell.exe was not generated" }

      - name: Validate OpenShell EXE icon
        shell: pwsh
        run: |
          python scripts/verify_windows_icons.py --icon build/windows/icon.ico --exe build/bin/OpenShell.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $portable = "dist/OpenShell-v$env:APP_VERSION.exe"
          Copy-Item "build/bin/OpenShell.exe" $portable -Force
          python scripts/verify_windows_icons.py --icon build/windows/icon.ico --exe $portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path $portable -DestinationPath "dist/OpenShell-v$env:APP_VERSION-windows-x64-portable.zip" -Force
          Remove-Item $portable

      - name: Ensure NSIS is installed
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (!(Test-Path $nsis)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (!(Test-Path $nsis)) { throw "NSIS not found at $nsis" }

      - name: Create Windows installer
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { throw "NSIS not found at $nsis" }
          $binary = (Resolve-Path "build/bin/OpenShell.exe").Path
          $icon = (Resolve-Path "build/windows/icon.ico").Path
          $setup = Join-Path (Resolve-Path "dist").Path "OpenShell-v$env:APP_VERSION-windows-x64-Setup.exe"
          & $nsis "/DAPP_VERSION=$env:APP_VERSION" "/DAPP_BINARY=$binary" "/DAPP_ICON=$icon" "/DAPP_OUTPUT=$setup" "build/windows/installer/openshell.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path $setup)) { throw "Installer was not generated" }

      - name: Validate NSIS installer icon
        shell: pwsh
        run: |
          python scripts/verify_windows_icons.py --icon build/windows/icon.ico --exe "dist/OpenShell-v$env:APP_VERSION-windows-x64-Setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenShell-windows-x64-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $releases = @(gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100 | ConvertFrom-Json)
          if (@($releases | Where-Object { $_.tagName -eq $tag }).Count -gt 0) {
            Write-Host "Release $tag already exists; not replacing published binaries."
            exit 0
          }
          $releaseArgs = @(
            "release", "create", $tag,
            "dist/OpenShell-v$env:APP_VERSION-windows-x64-Setup.exe",
            "dist/OpenShell-v$env:APP_VERSION-windows-x64-portable.zip",
            "--repo", $env:GITHUB_REPOSITORY,
            "--title", "OpenShell $tag",
            "--generate-notes",
            "--notes", "Windows x64 安装版与便携版；未经代码签名。"
          )
          $releaseArgs += @("--target", $env:GITHUB_SHA)
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep latest three GitHub Releases
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --exclude-drafts --json tagName,publishedAt | ConvertFrom-Json | Sort-Object publishedAt -Descending)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $older = @($releases | Select-Object -Skip 3)
          foreach ($release in $older) {
            Write-Host "Deleting old Release $($release.tagName), keeping its Git tag."
            gh release delete $release.tagName --repo $env:GITHUB_REPOSITORY --yes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
