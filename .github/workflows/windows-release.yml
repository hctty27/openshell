name: Build and release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: openshell-windows-release
  cancel-in-progress: false

jobs:
  go-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate semantic version tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Release tag must look like v0.1.14"
            exit 1
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run SSH integration tests on POSIX
        run: go test ./...

  windows-x64:
    needs: go-tests
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set build version from tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "VITE_APP_VERSION=$version" >> $env:GITHUB_ENV
          $config = Get-Content wails.json -Raw | ConvertFrom-Json
          $config.info.productVersion = $version
          $config | ConvertTo-Json -Depth 20 | Set-Content wails.json -Encoding utf8
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test -- --run

      - name: Verify 30px layout in Chromium
        working-directory: frontend
        run: |
          npx playwright install chromium
          npx playwright test --grep "compact sidebar removes detail actions"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Generate AI icon assets
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/generate_app_icons.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows executable
        shell: pwsh
        run: |
          & "$(go env GOPATH)\bin\wails.exe" build -platform windows/amd64 -clean -webview2 embed -ldflags "-X github.com/hctty27/openshell/internal/branding.Version=$env:APP_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "build/bin/OpenShell.exe")) { throw "OpenShell.exe was not generated" }

      - name: Validate OpenShell EXE icon
        shell: pwsh
        run: |
          python scripts/verify_windows_icons.py --icon build/windows/icon.ico --exe build/bin/OpenShell.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $portable = "dist/OpenShell-v$env:APP_VERSION.exe"
          Copy-Item "build/bin/OpenShell.exe" $portable -Force
          python scripts/verify_windows_icons.py --icon build/windows/icon.ico --exe $portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path $portable -DestinationPath "dist/OpenShell-v$env:APP_VERSION-windows-x64-portable.zip" -Force
          Remove-Item $portable

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create Windows installer
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { throw "NSIS not found at $nsis" }
          $binary = (Resolve-Path "build/bin/OpenShell.exe").Path
          $icon = (Resolve-Path "build/windows/icon.ico").Path
          $setup = Join-Path (Resolve-Path "dist").Path "OpenShell-v$env:APP_VERSION-windows-x64-Setup.exe"
          & $nsis "/DAPP_VERSION=$env:APP_VERSION" "/DAPP_BINARY=$binary" "/DAPP_ICON=$icon" "/DAPP_OUTPUT=$setup" "build/windows/installer/openshell.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path $setup)) { throw "Installer was not generated" }

      - name: Validate NSIS installer icon
        shell: pwsh
        run: |
          python scripts/verify_windows_icons.py --icon build/windows/icon.ico --exe "dist/OpenShell-v$env:APP_VERSION-windows-x64-Setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenShell-${{ github.ref_name }}-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $releases = @(gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100 | ConvertFrom-Json)
          if (@($releases | Where-Object { $_.tagName -eq $tag }).Count -gt 0) {
            Write-Host "Release $tag already exists; not replacing published binaries."
            exit 0
          }
          gh release create $tag "dist/OpenShell-v$env:APP_VERSION-windows-x64-Setup.exe" "dist/OpenShell-v$env:APP_VERSION-windows-x64-portable.zip" --repo $env:GITHUB_REPOSITORY --verify-tag --title "OpenShell $tag" --generate-notes --notes "Windows x64 安装版与便携版；未经代码签名。"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
