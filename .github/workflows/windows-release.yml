name: Build and release Windows

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-release.yml"
      - "frontend/**"
      - "internal/**"
      - "app.go"
      - "main.go"
      - "main_other.go"
      - "go.mod"
      - "go.sum"
      - "wails.json"
      - "build/windows/**"
      - "build/appicon.png"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openshell-windows-release
  cancel-in-progress: false

jobs:
  go-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run SSH integration tests on POSIX
        run: go test ./...

  windows-x64:
    needs: go-tests
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      APP_VERSION: "0.1.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test -- --run

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Build Windows executable
        shell: pwsh
        run: |
          & "$(go env GOPATH)\bin\wails.exe" build -platform windows/amd64 -clean -webview2 embed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "build/bin/OpenShell.exe")) { throw "OpenShell.exe was not generated" }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build/bin/OpenShell.exe" -DestinationPath "dist/OpenShell-v$env:APP_VERSION-windows-x64-portable.zip" -Force

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create Windows installer
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { throw "NSIS not found at $nsis" }
          $binary = (Resolve-Path "build/bin/OpenShell.exe").Path
          $icon = (Resolve-Path "build/windows/icon.ico").Path
          $setup = Join-Path (Resolve-Path "dist").Path "OpenShell-v$env:APP_VERSION-windows-x64-Setup.exe"
          & $nsis "/DAPP_VERSION=$env:APP_VERSION" "/DAPP_BINARY=$binary" "/DAPP_ICON=$icon" "/DAPP_OUTPUT=$setup" "build/windows/installer/openshell.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path $setup)) { throw "Installer was not generated" }

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenShell-v0.1.8-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $releases = @(gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100 | ConvertFrom-Json)
          if (@($releases | Where-Object { $_.tagName -eq $tag }).Count -gt 0) {
            Write-Host "Release $tag already exists; not replacing published binaries."
            exit 0
          }
          gh release create $tag "dist/OpenShell-v$env:APP_VERSION-windows-x64-Setup.exe" "dist/OpenShell-v$env:APP_VERSION-windows-x64-portable.zip" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "OpenShell $tag" --notes "OpenShell 官方图标全新设计：开放圆环与终端提示符；桌面程序、安装包、便携版和应用界面统一品牌视觉。Windows x64 安装版与便携版；未经代码签名。"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
