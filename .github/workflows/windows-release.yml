name: Build and release Windows

on:
  workflow_call:
    inputs:
      publish:
        description: Publish a GitHub Release after CI succeeds
        required: true
        type: boolean
      use_frontend_artifact:
        description: Reuse the frontend bundle built and tested in the caller workflow
        required: false
        default: false
        type: boolean
      ref_sha:
        description: Immutable commit SHA used by the calling verification workflow
        required: false
        default: ''
        type: string
  workflow_dispatch:
  # Exercise the real installer + portable packaging code on workflow changes.
  # Pull requests never publish a Release, regardless of the publish input.
  pull_request:
    branches: [main]
    paths:
      - "scripts/verify_windows_gui_subsystem.py"
      - "scripts/prepare_native_zmodem_windows.ps1"
      - "scripts/verify_native_only_zmodem_windows.ps1"
      - "scripts/test_native_zmodem_installer_upgrade.ps1"
      - "scripts/generate_native_zmodem_manifest.py"
      - "scripts/test_generate_native_zmodem_manifest.py"
      - "cmd/zmodem-launcher/**"
      - "build/windows/installer/openshell.nsi"
      - "scripts/generate_zmodem_manifest.py"
      - "scripts/test_generate_zmodem_manifest.py"
      - ".github/workflows/windows-release.yml"

permissions:
  contents: read

concurrency:
  group: openshell-windows-release-${{ github.workflow }}-${{ github.event.pull_request.number || 'main' }}
  # Supersede outdated PR dry runs, but never cancel a production release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_REF_SHA: ${{ inputs.ref_sha || github.sha }}
      # SignPath Foundation code signing. When SIGNPATH_API_TOKEN is not set,
      # the workflow still builds and publishes unsigned binaries.
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'openshell' }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'initial' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref_sha || github.sha }}
      - name: Validate and set build version
        shell: pwsh
        run: |
          $tag = (Get-Content ".github/release-version.txt" -Raw).Trim()
          if ($tag -notmatch "^v[0-9]+\.[0-9]+\.[0-9]+$") { throw "Invalid release version: $tag" }
          $version = $tag.Substring(1)
          $packageVersion = (Get-Content "frontend/package.json" -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $version) { throw "Version mismatch: $packageVersion vs $version" }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "VITE_APP_VERSION=$version" >> $env:GITHUB_ENV
          $info = Get-Content "build/windows/info.json" -Raw | ConvertFrom-Json
          $info.fixed.file_version = $version
          $info.info.'0000'.ProductVersion = $version
          $info | ConvertTo-Json -Depth 20 | Set-Content "build/windows/info.json" -Encoding utf8
      # Avoid extracting the large compiled Go build cache on Windows runners.
      - uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version-file: go.mod
          cache: false
      # Windows cache restoration was dominated by extracting ~630 MB of Go
      # build outputs. Cache module sources only and let Go compile locally.
      - name: Locate Go module cache
        shell: pwsh
        run: |
          "GO_MODULE_CACHE=$(go env GOMODCACHE)" >> $env:GITHUB_ENV
      - name: Cache Windows Go modules
        uses: actions/cache@v6
        with:
          path: ${{ env.GO_MODULE_CACHE }}
          key: windows-go-mod-v1-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - name: Locate Wails CLI binary
        id: wails-path
        shell: pwsh
        run: |
          $goPath = (go env GOPATH).Trim()
          $wails = Join-Path $goPath "bin/wails3.exe"
          "binary=$wails" >> $env:GITHUB_OUTPUT
      - name: Restore cached Wails CLI
        uses: actions/cache@v6
        with:
          path: ${{ steps.wails-path.outputs.binary }}
          key: windows-wails-cli-v3.1.0-go${{ steps.setup-go.outputs.go-version }}-${{ runner.arch }}
      - name: Download tested frontend bundle
        if: inputs.use_frontend_artifact
        uses: actions/download-artifact@v8
        with:
          name: openshell-frontend-dist
          path: frontend/dist
      - uses: actions/setup-node@v7
        if: ${{ !inputs.use_frontend_artifact }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        if: ${{ !inputs.use_frontend_artifact }}
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Verify frontend bundle
        shell: pwsh
        run: |
          if (!(Test-Path "frontend/dist/index.html")) { throw "Missing frontend/dist/index.html" }

      - name: Ensure cached Wails CLI
        shell: pwsh
        run: |
          $wails = Join-Path (go env GOPATH) "bin/wails3.exe"
          if (!(Test-Path $wails)) {
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Using cached Wails CLI: $wails"
          }
          if (!(Test-Path $wails)) { throw "Wails CLI missing after installation/cache restore" }

      - name: Restore generated app icons
        id: icon-cache
        uses: actions/cache@v6
        with:
          path: |
            build/appicon.png
            build/windows/icon.ico
            frontend/public/app-icon.png
          key: windows-app-icons-v1-${{ hashFiles('build/appicon.png', 'scripts/generate_app_icons.py') }}
      - name: Generate AI icon assets on cache miss
        if: steps.icon-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/generate_app_icons.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate generated app icons
        shell: pwsh
        run: |
          foreach ($file in @("build/appicon.png", "build/windows/icon.ico", "frontend/public/app-icon.png")) {
            if (!(Test-Path $file)) { throw "Required icon asset missing: $file" }
          }

      - name: Build Windows executable
        shell: pwsh
        run: |
          & "$(go env GOPATH)\bin\wails3.exe" generate bindings -names -ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$(go env GOPATH)\bin\wails3.exe" generate syso -manifest build/windows/wails.exe.manifest -icon build/windows/icon.ico -info build/windows/info.json -arch amd64 -out rsrc_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build/bin | Out-Null
          go build -mod=readonly -tags production -trimpath -ldflags "-H windowsgui -s -w -X github.com/hctty27/openshell/internal/branding.Version=$env:APP_VERSION" -o build/bin/OpenShell.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "build/bin/OpenShell.exe")) { throw "OpenShell.exe was not generated" }
          python scripts/verify_windows_gui_subsystem.py build/bin/OpenShell.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build native Rust ZMODEM sidecar
        shell: pwsh
        run: |
          Push-Location experiments/native-zmodem
          try {
            cargo generate-lockfile
            if ($LASTEXITCODE -ne 0) { throw "Rust lock resolution failed" }
            cargo test --locked --bin zmodem-sidecar
            if ($LASTEXITCODE -ne 0) { throw "Rust ZMODEM protocol tests failed" }
            cargo build --locked --release --bin zmodem-sidecar
            if ($LASTEXITCODE -ne 0) { throw "Rust ZMODEM sidecar release build failed" }
          } finally { Pop-Location }
      - name: Stage Rust-only ZMODEM helpers
        shell: pwsh
        run: |
          ./scripts/prepare_native_zmodem_windows.ps1
          ./scripts/verify_native_only_zmodem_windows.ps1 -TargetDir build/bin/zmodem
          $env:PYTHONIOENCODING = "utf-8"
          python experiments/native-zmodem/tests/interop_native_helpers.py "experiments/native-zmodem/target/release/zmodem-sidecar.exe" "build/bin/zmodem"
          if ($LASTEXITCODE -ne 0) { throw "Rust-only rz/sz wrapper interoperability failed" }
      - name: Generate and verify native-only bundle manifest
        shell: pwsh
        run: |
          python scripts/generate_native_zmodem_manifest.py --target build/bin/zmodem
          if ($LASTEXITCODE -ne 0) { throw "Native-only ZMODEM inventory failed" }
          ./scripts/verify_native_only_zmodem_windows.ps1 -TargetDir build/bin/zmodem

      - name: Validate OpenShell EXE icon
        shell: pwsh
        run: |
          python scripts/verify_windows_icons.py --icon build/windows/icon.ico --exe build/bin/OpenShell.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unsigned EXE for SignPath
        id: upload-unsigned-exe
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: OpenShell-unsigned-exe-${{ github.run_id }}
          path: build/bin/OpenShell.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign EXE with SignPath
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          parameters: |
            version: "${{ env.APP_VERSION }}"
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/signed-exe

      - name: Replace EXE with signed EXE
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem build/signed-exe -Recurse -Filter OpenShell.exe | Select-Object -First 1
          if (!$signed) { throw "Signed OpenShell.exe not found" }
          Copy-Item $signed.FullName "build/bin/OpenShell.exe" -Force
          $sig = Get-AuthenticodeSignature "build/bin/OpenShell.exe"
          Write-Host "Signature status: $($sig.Status) / $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "OpenShell.exe signature is not valid: $($sig.Status)" }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $portable = "dist/OpenShell-v$env:APP_VERSION.exe"
          Copy-Item "build/bin/OpenShell.exe" $portable -Force
          python scripts/verify_windows_gui_subsystem.py $portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_windows_icons.py --icon build/windows/icon.ico --exe $portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $staging = Join-Path (Resolve-Path "dist").Path "portable-staging"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item $portable -Destination $staging
          Copy-Item "build/bin/zmodem" -Destination (Join-Path $staging "zmodem") -Recurse
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath "dist/OpenShell-v$env:APP_VERSION-windows-x64-portable.zip" -Force
          Remove-Item $staging -Recurse -Force
          Remove-Item $portable

      - name: Ensure NSIS is installed
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (!(Test-Path $nsis)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (!(Test-Path $nsis)) { throw "NSIS not found at $nsis" }

      - name: Create Windows installer
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { throw "NSIS not found at $nsis" }
          $binary = (Resolve-Path "build/bin/OpenShell.exe").Path
          $icon = (Resolve-Path "build/windows/icon.ico").Path
          $setup = Join-Path (Resolve-Path "dist").Path "OpenShell-v$env:APP_VERSION-windows-x64-Setup.exe"
          $helpers = (Resolve-Path "build/bin/zmodem").Path
          & $nsis "/DAPP_VERSION=$env:APP_VERSION" "/DAPP_BINARY=$binary" "/DAPP_ICON=$icon" "/DAPP_HELPER_DIR=$helpers" "/DAPP_OUTPUT=$setup" "build/windows/installer/openshell.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path $setup)) { throw "Installer was not generated" }

      - name: Verify installer upgrades legacy MSYS2 files to Rust only
        shell: pwsh
        run: |
          ./scripts/test_native_zmodem_installer_upgrade.ps1 -Installer "dist/OpenShell-v$env:APP_VERSION-windows-x64-Setup.exe"

      - name: Export native-only ZMODEM bundle manifest
        shell: pwsh
        run: |
          Copy-Item "build/bin/zmodem/BUNDLED_COMPONENTS.json" "dist/OpenShell-v$env:APP_VERSION-windows-x64-zmodem-manifest.json" -Force

      - name: Validate NSIS installer icon
        shell: pwsh
        run: |
          python scripts/verify_windows_icons.py --icon build/windows/icon.ico --exe "dist/OpenShell-v$env:APP_VERSION-windows-x64-Setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unsigned installer for SignPath
        id: upload-unsigned-setup
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: OpenShell-unsigned-setup-${{ github.run_id }}
          path: dist/OpenShell-v${{ env.APP_VERSION }}-windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer with SignPath
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          parameters: |
            version: "${{ env.APP_VERSION }}"
          github-artifact-id: ${{ steps.upload-unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/signed-setup

      - name: Replace installer with signed installer
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $name = "OpenShell-v$env:APP_VERSION-windows-x64-Setup.exe"
          $signed = Get-ChildItem build/signed-setup -Recurse -Filter $name | Select-Object -First 1
          if (!$signed) { throw "Signed $name not found" }
          Copy-Item $signed.FullName "dist/$name" -Force
          $sig = Get-AuthenticodeSignature "dist/$name"
          Write-Host "Signature status: $($sig.Status) / $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Installer signature is not valid: $($sig.Status)" }

      - name: Publish build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OpenShell-windows-x64-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: inputs.publish && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $releases = @(gh release list --repo $env:GITHUB_REPOSITORY --json tagName,isDraft --limit 100 | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $existing = @($releases | Where-Object { $_.tagName -eq $tag } | Select-Object -First 1)
          if ($existing.Count -gt 0) {
            if ($existing[0].isDraft) {
              Write-Host "Recovering existing draft Release $tag without replacing its uploaded binaries."
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false
                if ($LASTEXITCODE -eq 0) { break }
                if ($attempt -eq 3) { exit $LASTEXITCODE }
                Start-Sleep -Seconds (3 * $attempt)
              }
            } else {
              Write-Host "Release $tag already exists; not replacing published binaries."
            }
            exit 0
          }
          $notes = if ($env:SIGNPATH_ENABLED -eq 'true') { "Windows x64 安装版与便携版；已通过 SignPath 进行代码签名（Free code signing provided by SignPath.io, certificate by SignPath Foundation）。" } else { "Windows x64 安装版与便携版；未经代码签名。" }
          $notes += "`n`nZMODEM on Windows uses only OpenShell's native Rust sidecar; no lrzsz-win32 or MSYS2 runtime is bundled."
          $notes += "`n`nCode signing policy: https://github.com/hctty27/openshell/blob/main/CODE_SIGNING_POLICY.md`nPrivacy policy: https://github.com/hctty27/openshell/blob/main/PRIVACY.md"
          $releaseArgs = @(
            "release", "create", $tag,
            "dist/OpenShell-v$env:APP_VERSION-windows-x64-Setup.exe",
            "dist/OpenShell-v$env:APP_VERSION-windows-x64-portable.zip",
            "dist/OpenShell-v$env:APP_VERSION-windows-x64-zmodem-manifest.json",
            "--repo", $env:GITHUB_REPOSITORY,
            "--title", "OpenShell $tag",
            "--generate-notes",
            "--notes", $notes
          )
          $releaseArgs += @("--target", $env:RELEASE_REF_SHA)
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep latest three GitHub Releases and major milestones
        if: inputs.publish && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --exclude-drafts --json tagName,publishedAt | ConvertFrom-Json | Sort-Object publishedAt -Descending)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Preserve stable major milestones such as v1.0.0 and v2.0.0.
          $older = @($releases | Select-Object -Skip 3 | Where-Object { $_.tagName -notmatch '^v[1-9]\d*\.0\.0$' })
          foreach ($release in $older) {
            Write-Host "Deleting old Release $($release.tagName), keeping its Git tag."
            gh release delete $release.tagName --repo $env:GITHUB_REPOSITORY --yes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
