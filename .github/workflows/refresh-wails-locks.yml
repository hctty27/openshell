name: Refresh Wails 3.1 dependency locks (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-locks:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/wails-v3.1.0-upgrade-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate Go and npm dependency locks
        run: |
          set -euo pipefail
          go mod tidy
          npm --prefix frontend install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile changes to this same-repository PR branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add go.mod go.sum frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate Wails 3.1 Go and npm lockfiles"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
