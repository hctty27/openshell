name: SFTP editor lockfile refresh
on:
  push:
    branches:
      - feat/sftp-codemirror-editor
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile for CodeMirror dependencies
        working-directory: frontend
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile if updated
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate frontend lockfile for SFTP editor'
            git push origin HEAD:feat/sftp-codemirror-editor
          fi
