name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      ref_sha:
        type: string
        default: ''

permissions:
  contents: read

# New PR commits supersede outdated PR checks. Every main push keeps its
# own group so a release-marker build cannot be displaced by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.detect.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect release marker change
        id: detect
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "No previous commit; skipping automatic release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$AFTER" -- .github/release-version.txt |
              grep -Fxq '.github/release-version.txt'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  go-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref_sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Check Wails Go module, CLI, and frontend lockstep versions
        run: python3 scripts/verify_wails_stack_versions.py
      - name: Test release metadata and third-party audit helpers
        run: python3 -m unittest scripts.test_bump_release_version scripts.test_audit_sbom scripts.test_generate_zmodem_manifest scripts.test_generate_native_zmodem_manifest scripts.test_signpath_release_policy
      - name: Check Go module files are tidy (without rewriting)
        run: go mod tidy -diff
      - name: Run Go race tests
        run: go test -race ./...
      - name: Check Go source
        run: go vet ./...

  frontend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Set frontend build version
        shell: bash
        run: echo "VITE_APP_VERSION=$(node -p 'require("./frontend/package.json").version')" >> "$GITHUB_ENV"
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify CSS module import order
        working-directory: frontend
        run: npm run audit:styles
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test -- --run
      - name: Audit unused frontend symbols
        working-directory: frontend
        run: npm run audit:unused
      - name: Audit production code graph with Knip
        if: contains(github.head_ref, 'remove-unused')
        working-directory: frontend
        run: npx --yes knip@6.43.0 --production
      # ubuntu-24.04 runners already include Google Chrome and OS libraries.
      # Using it avoids the slow apt download from playwright install --with-deps.
      # playwright.config.ts accepts PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH.
      - name: Select runner-installed Chrome for Playwright
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [[ -z "$chrome" || ! -x "$chrome" ]]; then
            echo "::error::Google Chrome is missing from the ubuntu-24.04 runner image."
            exit 1
          fi
          "$chrome" --version
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
      - name: Verify terminal background and compact layout in Chrome
        working-directory: frontend
        run: npx playwright test --grep "auto-hide sidebars ignore pointer entry while mouse buttons are held|terminal grid stays centered|compact sidebar removes detail actions|AI header aligns with SSH title bar|floating global AI overlays without moving or hiding terminal AI and SFTP|bilingual|dragging a connected tab splits|four sessions support nested splits"
      - name: Upload frontend bundle for Windows release
        if: github.event_name == 'push' || inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: openshell-frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  redis-pty-integration:
    name: Redis Cluster PTY integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref_sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install Redis CLI and server
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server redis-tools
      - name: Start a three-node Redis Cluster
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          echo "REDIS_CLUSTER_TEST_ROOT=$root" >> "$GITHUB_ENV"
          for port in 7000 7001 7002; do
            node="$root/$port"
            mkdir -p "$node"
            cat > "$node/redis.conf" <<EOF
          port $port
          bind 127.0.0.1
          protected-mode no
          daemonize yes
          supervised no
          pidfile $node/redis.pid
          logfile $node/redis.log
          dir $node
          cluster-enabled yes
          cluster-config-file nodes.conf
          cluster-node-timeout 5000
          appendonly no
          save ""
          EOF
            redis-server "$node/redis.conf"
          done
          for port in 7000 7001 7002; do
            for attempt in {1..30}; do
              if redis-cli -h 127.0.0.1 -p "$port" ping >/dev/null 2>&1; then break; fi
              sleep 0.2
            done
            redis-cli -h 127.0.0.1 -p "$port" ping
          done
          redis-cli --cluster create 127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 --cluster-replicas 0 --cluster-yes
          for attempt in {1..30}; do
            if redis-cli -h 127.0.0.1 -p 7000 cluster info | grep -q 'cluster_state:ok'; then exit 0; fi
            sleep 0.2
          done
          echo "Redis Cluster did not reach cluster_state:ok"
          cat "$root"/*/redis.log
          exit 1
      - name: Exercise real redis-cli through a PTY
        run: OPENSHELL_REDIS_CLUSTER_ADDR=127.0.0.1:7000 go test -race ./internal/ssh -run '^TestRedisClusterPTYRoundTrip$' -count=1
      - name: Stop Redis Cluster
        if: always()
        shell: bash
        run: |
          for port in 7000 7001 7002; do
            redis-cli -h 127.0.0.1 -p "$port" shutdown nosave >/dev/null 2>&1 || true
          done
          if [[ -n "${REDIS_CLUSTER_TEST_ROOT:-}" ]]; then rm -rf "$REDIS_CLUSTER_TEST_ROOT"; fi

  release:
    name: Windows release after CI
    needs: [changes, go-tests, frontend-tests, redis-pty-integration]
    if: always() && needs.go-tests.result == 'success' && needs.frontend-tests.result == 'success' && needs.redis-pty-integration.result == 'success' && (inputs.publish || (github.event_name == 'push' && needs.changes.outputs.release == 'true'))
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/windows-release.yml
    secrets: inherit
    with:
      publish: true
      use_frontend_artifact: true
      ref_sha: ${{ inputs.ref_sha || github.sha }}
