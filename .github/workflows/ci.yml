name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# New PR commits supersede outdated PR checks. Every main push keeps its
# own group so a release-marker build cannot be displaced by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.detect.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect release marker change
        id: detect
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "No previous commit; skipping automatic release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$AFTER" -- .github/release-version.txt |
              grep -Fxq '.github/release-version.txt'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  go-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Run Go race tests
        run: go test -race ./...
      - name: Check Go source
        run: go vet ./...

  frontend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test -- --run
      # ubuntu-24.04 runners already include Google Chrome and OS libraries.
      # Using it avoids the slow apt download from playwright install --with-deps.
      # playwright.config.ts accepts PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH.
      - name: Select runner-installed Chrome for Playwright
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [[ -z "$chrome" || ! -x "$chrome" ]]; then
            echo "::error::Google Chrome is missing from the ubuntu-24.04 runner image."
            exit 1
          fi
          "$chrome" --version
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
      - name: Verify terminal background and compact layout in Chrome
        working-directory: frontend
        run: npx playwright test --grep "terminal backdrop fills its pane|compact sidebar removes detail actions|AI header aligns with SSH title bar|bilingual|dragging a connected tab splits|four sessions support nested splits"

  release:
    name: Windows release after CI
    needs: [changes, go-tests, frontend-tests]
    if: github.event_name == 'push' && needs.changes.outputs.release == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/windows-release.yml
    secrets: inherit
    with:
      publish: true
