[package]
name = "openshell-core"
version = "0.2.0-alpha.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
alacritty_terminal = "0.26.0"
portable-pty = "0.9.0"
anyhow = "1"
russh = { version = "0.65.0", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs"] }
russh-sftp = "3.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
zeroize = "1.8"
rpassword = "7.4"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
