version: '3'

tasks:
  build:
    desc: Build OpenShell for Windows with Wails v3
    platforms: [windows]
    cmds:
      - task: frontend
      - task: windows

  frontend:
    desc: Build the React frontend
    dir: frontend
    cmds:
      - npm ci
      - npm run build

  windows:
    desc: Compile the Windows executable
    platforms: [windows]
    cmds:
      - go mod tidy
      - wails3 generate bindings -names -ts
      - wails3 generate icons -input build/appicon.png -windowsfilename build/windows/icon.ico
      - wails3 generate syso -manifest build/windows/wails.exe.manifest -icon build/windows/icon.ico -info build/windows/info.json -arch amd64 -out rsrc_windows_amd64.syso
      - go build -tags production -trimpath -ldflags="-H windowsgui -s -w" -o build/bin/OpenShell.exe .

  dev:
    desc: Start the Wails v3 desktop development environment
    platforms: [windows]
    cmds:
      - wails3 dev
